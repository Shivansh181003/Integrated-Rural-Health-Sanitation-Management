spring.application.name=appointment-service
server.port=8083

# Neon (cloud PostgreSQL), database db_anc.
# The password is NOT written here (public repo): set DB_PASSWORD in the IntelliJ run configuration.
spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_anc?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# run data.sql (sample data) after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# form fields <input type="date"> and <input type="time">
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm

# Redirects use "/appointments" instead of "http://localhost:8083/...", so they stay on the gateway
server.tomcat.use-relative-redirects=true

# Other services (direct, not through the gateway)
services.centre.url=http://localhost:8082
services.resident.url=http://localhost:8081
