spring.application.name=resident-service
server.port=8081

# Neon (cloud PostgreSQL), database db_resident - same Neon project as the other services.
# The password is NOT written here (public repo): set DB_PASSWORD in the IntelliJ run configuration.
spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_resident?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.open-in-view=false

# Redirects use "/residents/..." instead of "http://localhost:8081/...", so they stay on the gateway
server.tomcat.use-relative-redirects=true
